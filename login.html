<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Login</title>
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main>

    <h2 class="login-heading text-center m-4">Login</h2>

    <div id="horizonal-line"></div>


     <div id="login-form" class="form-wrapper">
        <form >

            <div id="login-email"> 
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" placeholder="name@example.com">
            </div>

            <div id="login-password"> 
                <label for="password">Password</label>
                <input type="password" name="password" id="password" placeholder="Password">
            </div>

            <p>New here? <a href="register.html">Register here</a></p>

            <div id="login-button" class="form-button-wrap"><button disabled>Login</button></div>

        </form>
    </div>

    </main>
    <script src="js/script.js"></script>
</body>
</html>
