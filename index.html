<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>TechShop</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">

            <div class="navbar-items container-fluid">

                <a class="fs-4 text fw-bold navbar-brand" href="#">Ecommerce</a>


                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>


                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class=" navbar-links navbar-nav">
                        <a class="nav-link" aria-current="page" href="#">Home</a>
                        <a class="nav-link" href="#">Products</a>
                        <a class="nav-link" href="#">About</a>
                        <a class="nav-link" href="#">Contact</a>
                    </div>
                </div>

                <div class="nav-actions">

                    <a href="" class="text-decoration-none text-body-secondary border border-secondary border-2 p-1 rounded"><i class="fa-solid fa-right-to-bracket "></i>Login</a>

                    <a href="" class="text-decoration-none text-body-secondary border border-secondary border-2 p-1 rounded"><i class="fa-solid fa-user-plus"></i>Register</a>

                    <a href="" class="text-decoration-none text-body-secondary border border-secondary border-2 p-1 rounded"><i class="fa-solid fa-cart-shopping"></i>Cart</a>

                </div>

            </div>
        </nav>
    </header>

    <main>

        <section class="hero-section">
            <div class="hero-image"></div>

            <div class="hero-content">
                <h1>New Season Arrivals</h1>

                <p>Discover our latest arrivals, featuring fresh styles, elegant essentials, and innovative finds
                    for every lifestyle. Shop the newest trends and must-have picks, all in one place</p>
            </div>

        </section>


        <h2 class="latest-prod">Latest Products</h2>


        <div class="filter-buttons">
            <button class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">All</button>
            <button class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Men's Clothing</button>
            <button class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Women's Clothing</button>
            <button class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Jewelery</button>
            <button class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Electronics</button>
        </div>

        <section id="products">
        </section>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
