<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>TechShop</title>
</head>

<body>
    <header>
        
       <div id="navbar">

       </div>
    </header>

    <main>

        <section class="hero-section">
            <div class="hero-image"></div>

            <div class="hero-content">
                <h1>New Season Arrivals</h1>

                <p>Discover our latest arrivals, featuring fresh styles, elegant essentials, and innovative finds
                    for every lifestyle. Shop the newest trends and must-have picks, all in one place</p>
            </div>

        </section>


        <h2 class="latest-prod">Latest Products</h2>

        <div class="filter-buttons">
            <button id="all-btn" class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">All</button>
            <button id="mens-btn"  class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Men's Clothing</button>
            <button id="womens-btn"  class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Women's Clothing</button>
            <button id="jewelry-btn"  class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Jewelry</button>
            <button id="electronics-btn"  class="btn btn-sm btn-outline-secondary border-2 p-1 rounded" type="button">Electronics</button>
        </div>

        <section id="products">
        </section>
    </main>

   <script src="js/script.js"></script>
   <script src="js/products.js"></script>
   <script src="js/cart.js"></script>
</body>

</html>
